name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    # This repo is public, so hosted runners are free. Do not move it to the
    # self-hosted fleet the private repos in the set have to use.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: shellcheck
        run: shellcheck --shell=bash scripts/gates.sh root/etc/s6-overlay/s6-rc.d/svc-dbus/run

  # amd64 only: OSNV-4 dropped arm releases, so CI builds what is published.
  #
  # The Dockerfile still selects an aarch64 AppImage when TARGETARCH says so, so
  # this repo remains buildable on arm hardware — it is simply not built here
  # and not published. Nothing in CI covers that path; the README says so
  # rather than implying a guarantee this matrix does not give.
  #
  # If arm64 is ever restored, add `{platform: linux/arm64, runner:
  # ubuntu-24.04-arm}` — and use a NATIVE runner, not `setup-qemu-action`.
  # That is not a speed preference: an emulated arm64 build of this image cannot
  # succeed at all. OrcaSlicer's aarch64 AppImage is a **static-pie** ELF and
  # qemu-user/binfmt cannot exec one, so `./orca.app --appimage-extract` dies
  # with "Exec format error" (exit 126) before anything is extracted.
  # Reproduced in a plain `debian:trixie` arm64 container, so it is nothing to
  # do with the selkies base, and the same AppImage extracts fine natively.
  # QEMU would make that job red forever, not slow.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.platform }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          build-args: |
            BUILD_DATE=${{ github.event.pull_request.updated_at }}
            VERSION=pr-${{ github.event.number }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
