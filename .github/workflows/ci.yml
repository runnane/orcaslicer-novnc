name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    # This repo is public, so hosted runners are free. Do not move it to the
    # self-hosted fleet the private repos in the set have to use.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: shellcheck
        run: shellcheck --shell=bash scripts/gates.sh root/etc/s6-overlay/s6-rc.d/svc-dbus/run

  # arm64 is the one thing CI checks that the local gates deliberately skip, so
  # an arm64-only regression surfaces here first.
  #
  # It runs on a NATIVE arm64 runner, and that is not a speed preference — an
  # emulated arm64 build of this image cannot succeed at all. OrcaSlicer's
  # aarch64 AppImage is a **static-pie** ELF, and qemu-user/binfmt cannot exec
  # one: `./orca.app --appimage-extract` dies with "Exec format error" (exit
  # 126) before anything is extracted. Reproduced in a plain `debian:trixie`
  # arm64 container, so it is nothing to do with the selkies base; and the same
  # AppImage extracts fine on a native arm64 runner. Putting `setup-qemu-action`
  # back would make this job red forever, not slow.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.platform }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          build-args: |
            BUILD_DATE=${{ github.event.pull_request.updated_at }}
            VERSION=pr-${{ github.event.number }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
